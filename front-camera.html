<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rear Camera</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
}

video {
    width: 95%;
    max-width: 800px;
    border-radius: 15px;
    background: black;
}

button {
    margin: 10px;
    padding: 15px 25px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
}

#start {
    background: green;
    color: white;
}

#stop {
    background: red;
    color: white;
}

#status {
    font-size: 18px;
}
</style>
</head>

<body>

<h1>📷 REAR CAMERA</h1>

<p id="status">Camera OFF</p>

<video id="video" autoplay playsinline></video>

<br>

<button id="start">START REAR CAMERA</button>
<button id="stop">STOP CAMERA</button>

<script>

const video = document.getElementById("video");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const status = document.getElementById("status");

let stream = null;

async function startRearCamera() {

    try {

        status.textContent = "Opening rear camera...";

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment",
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                },
                frameRate: {
                    ideal: 60,
                    max: 60
                }
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings();

        status.textContent =
            "🟢 REAR CAMERA ON | " +
            settings.width + " × " +
            settings.height +
            " | " +
            (settings.frameRate || "?") +
            " FPS";

        console.log("Camera:", settings);

    } catch (error) {

        console.error(error);

        status.textContent = "🔴 " + error.name + ": " + error.message;

    }
}

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;
    }

    video.srcObject = null;

    status.textContent = "Camera OFF";
}

startButton.addEventListener("click", startRearCamera);
stopButton.addEventListener("click", stopCamera);

</script>

</body>
</html>
