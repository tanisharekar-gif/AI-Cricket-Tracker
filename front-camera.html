<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rear Camera</title>
</head>

<body>

<h2>Rear Camera Test</h2>

<select id="cameras"></select>

<br><br>

<button onclick="openCamera()">OPEN REAR CAMERA</button>
<button onclick="stopCamera()">STOP</button>

<br><br>

<video id="video" autoplay playsinline style="width:100%;"></video>

<p id="status">Ready</p>

<script>

const video = document.getElementById("video");
const cameras = document.getElementById("cameras");
const status = document.getElementById("status");

let stream = null;

async function getCameras() {

    try {

        await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        const devices =
            await navigator.mediaDevices.enumerateDevices();

        cameras.innerHTML = "";

        const videoDevices =
            devices.filter(device => device.kind === "videoinput");

        videoDevices.forEach((device, index) => {

            const option = document.createElement("option");

            option.value = device.deviceId;

            option.textContent =
                device.label || "Camera " + (index + 1);

            cameras.appendChild(option);

        });

        const rearCamera =
            videoDevices.find(device =>
                /back|rear|environment|main/i.test(device.label)
            );

        if (rearCamera) {
            cameras.value = rearCamera.deviceId;
        }

        status.textContent =
            videoDevices.length + " camera(s) found";

    } catch (error) {

        status.textContent = error.name;

    }
}

async function openCamera() {

    try {

        stopCamera();

        const deviceId = cameras.value;

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                deviceId: {
                    exact: deviceId
                },
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                }
            },
            audio: false
        });

        video.srcObject = stream;

        status.textContent = "🟢 REAR CAMERA ACTIVE";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Camera error: " + error.name;

    }
}

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;
    }

    video.srcObject = null;
}

getCameras();

</script>

</body>
</html>
