<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Camera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 25px 0 10px;
        }

        #status {
            margin: 10px;
            font-size: 18px;
        }

        .camera {
            width: 95%;
            max-width: 700px;
            position: relative;
            margin-top: 15px;
        }

        video {
            width: 100%;
            display: block;
            background: black;
            border-radius: 15px;
            transform: scaleX(-1);
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #start {
            background: green;
            color: white;
        }

        #stop {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

    <h1>📱 Front Camera</h1>

    <div id="status">Camera OFF</div>

    <div class="camera">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="buttons">
        <button id="start">START FRONT CAMERA</button>
        <button id="stop">STOP CAMERA</button>
    </div>

    <script>
        const video = document.getElementById("video");
        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");
        const status = document.getElementById("status");

        let stream = null;

        async function startCamera() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Camera not supported");
                }

                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: {
                            exact: "user"
                        }
                    },
                    audio: false
                });

                video.srcObject = stream;

                video.onloadedmetadata = async function () {
                    await video.play();
                    status.textContent = "🟢 FRONT CAMERA ON";
                };

            } catch (error) {
                console.error(error);
                status.textContent = "🔴 CAMERA ERROR: " + error.name;
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;
            status.textContent = "Camera OFF";
        }

        startButton.addEventListener("click", startCamera);
        stopButton.addEventListener("click", stopCamera);
    </script>

</body>
</html>
